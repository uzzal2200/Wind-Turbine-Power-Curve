# DA-PINN Configuration
# All hyperparameters and paths for reproducibility

# ── Paths ────────────────────────────────────────────────────────────────────
paths:
  raw_data_dir:       "data/raw"
  processed_data_dir: "data/processed"
  checkpoint_dir:     "outputs/checkpoints"
  predictions_dir:    "outputs/predictions"
  figures_dir:        "figures"
  log_dir:            "logs"

# ── Dataset ──────────────────────────────────────────────────────────────────
dataset:
  turbine_ids: [1, 2, 3, 4, 5, 6]        # Kelmarsh Senvion MM92 turbines
  rated_power_kw: 2050.0
  rotor_diameter_m: 92.0
  hub_height_m: 80.0
  sampling_interval_min: 10

  # IEC 61400-12-1 preprocessing
  v_cut_in_ms:  3.5
  v_cut_out_ms: 25.0
  power_overrating_tol: 0.05             # discard samples > rated × (1 + tol)
  gap_interpolate_min: 30                # linear interpolation for gaps ≤ this
  pitch_curtailment_threshold_deg: 88.0  # pitch saturation → curtailment

  # Chronological split (no data leakage)
  train_years: [2016, 2017, 2018, 2019, 2020, 2021]
  val_years:   [2022]
  test_years:  [2023, 2024]

# ── Feature Engineering ──────────────────────────────────────────────────────
features:
  scada_cols:
    - wind_speed_ms
    - active_power_kw
    - rotor_speed_rpm
    - pitch_angle_deg
    - ambient_temp_c
    - blade_temp_1_c
    - blade_temp_2_c
    - blade_temp_3_c
    - gearbox_bearing_temp_c
    - generator_temp_c
    - grid_frequency_hz
    - nacelle_direction_deg

  health_vector_cols:
    - delta_t_blade        # Blade temperature differential
    - pr_6h                # 6-hour rolling median performance ratio
    - ai_pitch             # Pitch asymmetry index

  pr_rolling_window_steps: 6            # 6 × 10 min = 60 min rolling median

# ── Proxy Labeling ───────────────────────────────────────────────────────────
proxy_labeling:
  temp_threshold_c:    2.0
  pr_mild_threshold:   0.90             # PR < 0.90 → Mild or Severe
  pr_severe_threshold: 0.70             # PR < 0.70 → Severe
  majority_vote_steps: 3                # temporal smoother window

  class_names: ["Healthy", "Mild", "Severe"]
  class_ids:   [0, 1, 2]

# ── Physics Constants ────────────────────────────────────────────────────────
physics:
  rho_air_kg_m3:   1.225
  betz_limit:      0.5926              # 16/27
  cp_max:          0.593
  rotor_area_m2:   6647.61            # π × (46)²

  # Monotonicity region
  v_mono_min_ms:   3.5
  v_mono_max_ms:   12.5
  delta_v_ms:      0.5

# ── Model ────────────────────────────────────────────────────────────────────
model:
  input_dim: 15                        # 12 SCADA + 3 health
  hidden_dims: [64, 128, 64]
  activation: "relu"
  dropout: 0.0
  output_dim: 1

# ── Physics Loss Weights ──────────────────────────────────────────────────────
loss:
  lambda_betz:   0.8
  lambda_cp:     0.5
  lambda_smooth: 0.3

# ── Training ─────────────────────────────────────────────────────────────────
training:
  lr:           1.0e-3
  batch_size:   256
  max_epochs:   200
  patience:     20                     # early stopping
  seed:         42
  device:       "auto"                 # "auto" | "cpu" | "cuda"
  num_workers:  4

# ── CUSUM Monitor ─────────────────────────────────────────────────────────────
cusum:
  k_factor: 0.5                        # allowance  = k_factor × σ₀
  h_factor: 4.0                        # alert threshold = h_factor × σ₀
  # σ₀ calibrated on validation set (auto-computed; cached after first run)
  sigma0:   0.0625

# ── Baselines ────────────────────────────────────────────────────────────────
baselines:
  polynomial:
    degree: 5
  gpr:
    kernel: "rbf"
  xgboost:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
  lstm:
    hidden_size: 64
    num_layers: 2
    seq_length: 12
    dropout: 0.2
  plain_mlp:
    hidden_dims: [64, 128, 64]         # identical to DA-PINN backbone
    lambda_betz: 0.0
    lambda_cp: 0.0
    lambda_smooth: 0.0
